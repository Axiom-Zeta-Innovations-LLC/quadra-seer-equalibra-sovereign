name: Stack smoke

# Runs the real stack on a Docker machine (the GitHub runner): builds the
# images, starts the local-mode compose stack via scripts/stack.sh, and
# exercises /health plus an authenticated chat round-trip against a tiny
# Ollama model running on the host — the same path a user's machine takes.
on:
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "scripts/stack.sh"
      - "DEPLOYMENT.md"
      - "Dockerfile"
      - "Dockerfile.python"
      - ".github/workflows/stack-smoke.yml"
  workflow_dispatch:

jobs:
  stack-smoke:
    name: stack.sh local up + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # The backend build pulls the multi-GB torch dependency tree; a stock
      # runner's ~14 GB free disk is not enough once Ollama + both images are
      # on it (the first smoke run died with Errno 28 in pip). Free the
      # preinstalled toolchains we do not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Show Docker / Compose versions
        run: |
          docker version
          docker compose version

      - name: Install and start Ollama (host LLM, tiny CI model)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull qwen2.5:0.5b

      - name: Write CI .env.local (throwaway secrets, tiny model)
        run: |
          cat > .env.local <<'EOF'
          ATLANTEAN_API_TOKEN=ci-smoke-token-0123456789abcdef
          VITE_API_TOKEN=ci-smoke-token-0123456789abcdef
          ATLANTEAN_SESSION_SECRET=ci-smoke-session-secret-0123456789abcdef
          LOCAL_LLM_MODEL=qwen2.5:0.5b
          EOF

      - name: stack.sh local up
        run: ./scripts/stack.sh local up

      - name: stack.sh local smoke (health + frontend via proxy)
        run: ./scripts/stack.sh local smoke

      - name: Authenticated chat round-trip (frontend proxy -> backend -> Ollama)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:5000/api/atlantean/query",
              data=json.dumps({"input": "Reply with the single word: ready", "llm_provider": "local"}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer ci-smoke-token-0123456789abcdef",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=240) as r:
                  body = r.read().decode("utf-8", "replace")
                  status = r.status
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              status = e.code
          print("HTTP", status)
          print(body[:800])
          assert status == 200, f"chat query failed with HTTP {status}"
          assert "error" not in body[:200].lower() or "ready" in body.lower(), "response looks like an error"
          PY

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml logs --tail 120 || true

      - name: Teardown
        if: always()
        run: ./scripts/stack.sh local down || true
