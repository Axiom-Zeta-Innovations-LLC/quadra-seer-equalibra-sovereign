services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      # Cloud provider — optional, only used when cloud escalation is enabled + consented.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      ATLANTEAN_SESSION_SECRET: ${ATLANTEAN_SESSION_SECRET:?ATLANTEAN_SESSION_SECRET must be set to a random value}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      # Local LLM — point at a running Ollama/llama.cpp/vLLM instance.
      ATLANTEAN_LLM_PROVIDER: ${ATLANTEAN_LLM_PROVIDER:-local}
      LOCAL_LLM_BACKEND: ${LOCAL_LLM_BACKEND:-ollama}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434/api/generate}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      ATLANTEAN_HARDWARE_TIER: ${ATLANTEAN_HARDWARE_TIER:-medium}
      # Local voice pipeline (Step 31).
      ATLANTEAN_WHISPER_MODEL: ${ATLANTEAN_WHISPER_MODEL:-base}
      ATLANTEAN_WHISPER_DEVICE: ${ATLANTEAN_WHISPER_DEVICE:-cpu}
      ATLANTEAN_WHISPER_COMPUTE_TYPE: ${ATLANTEAN_WHISPER_COMPUTE_TYPE:-int8}
      ATLANTEAN_PIPER_VOICE: ${ATLANTEAN_PIPER_VOICE:-en_US-lessac-medium}
      ATLANTEAN_PIPER_VOICE_DIR: /app/voices
      # Sovereign Workspace — all outbound blocked by default.
      ALLOW_OUTBOUND_NETWORK: ${ALLOW_OUTBOUND_NETWORK:-0}
      ALLOW_CLOUD_ESCALATION: ${ALLOW_CLOUD_ESCALATION:-0}
      ATLANTEAN_ALLOW_BROWSER_SPEECH_FALLBACK: ${ATLANTEAN_ALLOW_BROWSER_SPEECH_FALLBACK:-0}
      ATLANTEAN_REQUIRE_LOCAL_STT: ${ATLANTEAN_REQUIRE_LOCAL_STT:-1}
      ATLANTEAN_JOURNAL_DIR: /app/vault_data/journal
      ATLANTEAN_VECTOR_DB_PATH: /app/vault_data/vector_index
      ATLANTEAN_INDEX_MAX_FILE_MB: ${ATLANTEAN_INDEX_MAX_FILE_MB:-50}
      # Authentication — required for non-loopback deployment.
      ATLANTEAN_API_TOKEN: ${ATLANTEAN_API_TOKEN:?ATLANTEAN_API_TOKEN must be set to a long random value}
      ATLANTEAN_BIND_HOST: 0.0.0.0
    # host.docker.internal resolves on Docker Desktop (Mac/Windows).
    # On Linux Docker Engine it requires this explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount host voice models directory so Piper can access .onnx files.
      - piper_voices_data:/app/voices
      # Persistent storage for semantic search index, journal, and automation audit logs.
      - vault_data:/app/vault_data
    ports:
      - "5001:5001"
    # Resource limits — lancedb + sentence-transformers need more headroom than base.
    mem_limit: 6g
    cpus: "2.0"
    pids_limit: 512
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only: Vite bakes VITE_* vars into the JS bundle, so the
        # token must be passed here (runtime `environment:` would NOT work).
        # Must match ATLANTEAN_API_TOKEN so the browser sends the Bearer token.
        VITE_API_TOKEN: ${VITE_API_TOKEN:?VITE_API_TOKEN must match ATLANTEAN_API_TOKEN}
    # NOTE: VITE_ATLANTEAN_PROXY_TARGET and PORT only affected the old vite dev
    # server; the production image is nginx (port 80) with /api + /health
    # proxied to the backend (see nginx.conf).
    ports:
      # host:container -- nginx listens on 80 inside the container
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  node_modules_cache:
  piper_voices_data:
  vault_data: