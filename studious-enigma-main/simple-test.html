<!DOCTYPE html>
<html>
<head>
    <title>Connection Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a2e;
            color: white;
        }
        .box { 
            background: #16213e; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 8px;
            border-left: 4px solid #0f3460;
        }
        .success { border-left-color: #10b981; }
        .error { border-left-color: #ef4444; }
    </style>
</head>
<body>
    <h1>🧠 Atlantean Backend Test</h1>
    
    <div class="box">
        <h2>Page Loaded</h2>
        <p>If you see this, the HTML is working!</p>
        <p>Current time: <span id="time"></span></p>
    </div>

    <div class="box" id="backend-test">
        <h2>Testing Backend Connection...</h2>
        <p id="backend-status">Checking...</p>
    </div>

    <div class="box">
        <h2>Manual Tests</h2>
        <p>Try these URLs directly in your browser:</p>
        <ul>
            <li><a id="health-link" href="#" target="_blank">/health</a></li>
            <li><a id="status-link" href="#" target="_blank">/api/atlantean/status</a></li>
        </ul>
    </div>

    <div class="box">
        <h2>Debug Info</h2>
        <pre id="debug"></pre>
    </div>

    <script>
        // Show current time to prove JS is working
        document.getElementById('time').textContent = new Date().toLocaleString();
        
        const debug = document.getElementById('debug');
        const backendStatus = document.getElementById('backend-status');
        const backendTest = document.getElementById('backend-test');
        
        debug.textContent = `Location: ${window.location.href}\n`;
        debug.textContent += `Protocol: ${window.location.protocol}\n`;
        debug.textContent += `Hostname: ${window.location.hostname}\n`;
        debug.textContent += `Port: ${window.location.port}\n`;
        
        // Try to connect to backend.
        // Use query param override (?backend=https://api.example.com), else same-origin.
        const backendOverride = new URLSearchParams(window.location.search).get('backend');
        const backendUrl = (backendOverride || window.location.origin).replace(/\/$/, '');
        document.getElementById('health-link').href = `${backendUrl}/health`;
        document.getElementById('health-link').textContent = `${backendUrl}/health`;
        document.getElementById('status-link').href = `${backendUrl}/api/atlantean/status`;
        document.getElementById('status-link').textContent = `${backendUrl}/api/atlantean/status`;
        debug.textContent += `\nBackend URL: ${backendUrl}/health\n`;
        
        fetch(`${backendUrl}/health`)
            .then(response => {
                debug.textContent += `Response status: ${response.status}\n`;
                return response.json();
            })
            .then(data => {
                backendTest.className = 'box success';
                backendStatus.innerHTML = `✅ <strong>SUCCESS!</strong><br>Backend: ${data.service}<br>Status: ${data.status}`;
                debug.textContent += `Response: ${JSON.stringify(data, null, 2)}\n`;
            })
            .catch(error => {
                backendTest.className = 'box error';
                backendStatus.innerHTML = `❌ <strong>FAILED</strong><br>Error: ${error.message}`;
                debug.textContent += `\nError: ${error.message}\n`;
                debug.textContent += `Error stack: ${error.stack}\n`;
            });
    </script>
</body>
</html>
