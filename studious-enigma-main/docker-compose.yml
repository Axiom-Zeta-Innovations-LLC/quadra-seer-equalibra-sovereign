services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      # Cloud provider — optional, only used when cloud escalation is enabled + consented.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ATLANTEAN_SESSION_SECRET: ${ATLANTEAN_SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      # Local LLM — point at a running Ollama/llama.cpp/vLLM instance.
      ATLANTEAN_LLM_PROVIDER: ${ATLANTEAN_LLM_PROVIDER:-local}
      LOCAL_LLM_BACKEND: ${LOCAL_LLM_BACKEND:-ollama}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434/api/generate}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      ATLANTEAN_HARDWARE_TIER: ${ATLANTEAN_HARDWARE_TIER:-medium}
      # Local voice pipeline (Step 31).
      ATLANTEAN_WHISPER_MODEL: ${ATLANTEAN_WHISPER_MODEL:-base}
      ATLANTEAN_WHISPER_DEVICE: ${ATLANTEAN_WHISPER_DEVICE:-cpu}
      ATLANTEAN_WHISPER_COMPUTE_TYPE: ${ATLANTEAN_WHISPER_COMPUTE_TYPE:-int8}
      ATLANTEAN_PIPER_VOICE: ${ATLANTEAN_PIPER_VOICE:-en_US-lessac-medium}
      ATLANTEAN_PIPER_VOICE_DIR: /app/voices
      # Authentication — set to a long random secret in production.
      ATLANTEAN_API_TOKEN: ${ATLANTEAN_API_TOKEN:-}
      ATLANTEAN_BIND_HOST: 0.0.0.0
    # host.docker.internal resolves on Docker Desktop (Mac/Windows).
    # On Linux Docker Engine it requires this explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount host voice models directory so Piper can access .onnx files.
      - piper_voices_data:/app/voices
    ports:
      - "5001:5001"
    # Resource limits — adjust to Vault hardware capacity.
    mem_limit: 4g
    cpus: "1.5"
    pids_limit: 512
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_ATLANTEAN_PROXY_TARGET: http://backend:5001
      # Must match ATLANTEAN_API_TOKEN so the browser sends the bearer header.
      VITE_API_TOKEN: ${VITE_API_TOKEN:-${ATLANTEAN_API_TOKEN:-}}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  node_modules_cache:
  piper_voices_data: