<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlantean Integration Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5em;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.2);
        }
        .success { border-left: 5px solid #10b981; }
        .error { border-left: 5px solid #ef4444; }
        .info { border-left: 5px solid #3b82f6; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Atlantean Integration Test</h1>
        
        <div id="status" class="status info">
            <strong>Status:</strong> Initializing...
        </div>

        <div style="margin: 20px 0;">
            <button onclick="testHealth()">Test Health</button>
            <button onclick="testStatus()">Get Status</button>
            <button onclick="testFields()">Get Fields</button>
            <button onclick="testLearning()">Apply Learning</button>
            <button onclick="testQuery()">Test Query</button>
        </div>

        <h3>Response:</h3>
        <pre id="response">Click a button to test the API...</pre>
    </div>

    <script>
        const BACKEND_URL = window.location.protocol + '//' + window.location.hostname + ':5001';
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = `<strong>Status:</strong> ${message}`;
        }

        function updateResponse(data) {
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            updateStatus('Loading... <span class="loading"></span>', 'info');
            
            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };
                
                if (body) {
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(`${BACKEND_URL}${endpoint}`, options);
                const data = await response.json();
                
                updateStatus('✅ Request successful', 'success');
                updateResponse(data);
                return data;
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, 'error');
                updateResponse({ error: error.message });
                console.error('API Error:', error);
            }
        }

        async function testHealth() {
            await apiCall('/health');
        }

        async function testStatus() {
            await apiCall('/api/atlantean/status');
        }

        async function testFields() {
            await apiCall('/api/atlantean/fields');
        }

        async function testLearning() {
            await apiCall('/api/atlantean/learning-event', 'POST', {
                event: 'user_confirmation'
            });
        }

        async function testQuery() {
            await apiCall('/api/atlantean/query', 'POST', {
                input: 'Hello, Atlantean Intelligence!',
                llm_provider: 'mock'
            });
        }

        // Test on load
        window.onload = async () => {
            updateStatus('Testing connection...', 'info');
            
            try {
                const data = await fetch(`${BACKEND_URL}/health`).then(r => r.json());
                updateStatus(`✅ Connected to backend: ${data.service}`, 'success');
                updateResponse(data);
            } catch (error) {
                updateStatus(`❌ Cannot connect to backend at ${BACKEND_URL}`, 'error');
                updateResponse({ 
                    error: error.message,
                    note: 'Make sure the backend is running on port 5001'
                });
            }
        };
    </script>
</body>
</html>
