name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Python test suite
        run: pytest -q

  docker-builds:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build frontend image (Dockerfile)
        run: docker build -f Dockerfile --build-arg VITE_API_TOKEN=ci-build-token -t quadra-seer-frontend:ci .

      - name: Build backend image (Dockerfile.python)
        run: docker build -f Dockerfile.python -t quadra-seer-backend:ci .

      - name: Build legacy sidecar image (Dockerfile.backend)
        run: docker build -f Dockerfile.backend -t quadra-seer-sidecar:ci .
